limit_req_zone $binary_remote_addr zone=ff_global_per_ip_ip:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=ff_auth_per_ip_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ff_conn_per_ip_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_PUBLIC_IP;

    client_max_body_size 15m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # ACME challenge location (used by lego/certbot HTTP-01)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_PUBLIC_IP;

    client_max_body_size 15m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # For Let's Encrypt IP cert via lego:
    ssl_certificate /etc/lego/certificates/YOUR_PUBLIC_IP.crt;
    ssl_certificate_key /etc/lego/certificates/YOUR_PUBLIC_IP.key;

    # If you use self-signed fallback, use:
    # ssl_certificate /etc/ssl/certs/fallout-ip.crt;
    # ssl_certificate_key /etc/ssl/private/fallout-ip.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/api/auth/(login|register|refresh)$ {
        limit_req zone=ff_auth_per_ip_ip burst=20 nodelay;
        limit_conn ff_conn_per_ip_ip 20;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=ff_global_per_ip_ip burst=40 nodelay;
        limit_conn ff_conn_per_ip_ip 40;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
